name: 🐛 Bug Report
description: File a bug report to help us improve SENTINEL
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please
        search the [existing issues](https://github.com/asifahamed-ece/sentinel/issues) first to avoid duplicates.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: What part of SENTINEL is misbehaving?
      options:
        - Worker Node firmware (node_src)
        - Admin Hub firmware (admin_src)
        - Web dashboard (docs)
        - Shared packet protocol (packet_defs.h)
        - Documentation / README
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: Version shown on boot or in source header (e.g., v6.4, Admin v6.0)
      placeholder: "v6.4"
  - type: input
    id: hardware
    attributes:
      label: Hardware / board
      description: ESP32 board model and which sensors are attached
      placeholder: "DOIT ESP32 DEVKIT V1, MPU6050 + DHT22 + MQ-2"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include expected vs. actual behavior.
      placeholder: "When I press panic, the dashboard never shows the sticky alert..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Be as specific as possible.
      placeholder: |
        1. Flash hub firmware and upload dashboard to LittleFS
        2. Power on 2 worker nodes
        3. Press the panic button on node 1
        4. See the alert disappear after ~30s
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Serial / console output
      description: Paste relevant serial output, dashboard console logs, or screenshots.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow our [Code of Conduct](https://github.com/asifahamed-ece/sentinel/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true